<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game Suite by PsVanD</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #2c70ee 0%, #2c70ee 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 24px;
        }
        h1 {
            text-align: center;
            color: #6366f1;
            margin-bottom: 24px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 14px;
            font-size: 1.1em;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background: #4338ca;
        }
        .game-section {
            display: none;
            margin-top: 24px;
        }
        .back-btn {
            margin-top: 24px;
            background: #e0e7ff;
            color: #6366f1;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .result {
            margin-top: 16px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            color: #334155;
        }
        input, select {
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            width: 100%;
            font-size: 1em;
        }
        label {
            font-weight: 500;
            color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Math Game Suite by PsVanD</h1>
        <div id="main-menu">
            <button class="menu-btn" onclick="showGame('calculator')">Kalkulator</button>
            <button class="menu-btn" onclick="showGame('kaprekar')">Kaprekar</button>
            <button class="menu-btn" onclick="showGame('rps')">Batu Gunting Kertas</button>
            <button class="menu-btn" onclick="showGame('guess')">Tebak Angka</button>
            <button class="menu-btn" onclick="showGame('roulette')">Russian Roulette</button>
        </div>
        <div id="calculator" class="game-section">
            <h2>Kalkulator</h2>
            <label>Angka pertama:</label>
            <input type="number" id="calc-a">
            <label>Angka kedua:</label>
            <input type="number" id="calc-b">
            <label>Operator:</label>
            <select id="calc-op">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>
            <button class="menu-btn" onclick="runCalculator()">Hitung</button>
            <div id="calc-result" class="result"></div>
            <button class="back-btn" onclick="backToMenu()">Kembali</button>
        </div>
        <div id="kaprekar" class="game-section">
            <h2>Kaprekar</h2>
            <label>Masukkan angka 4 digit:</label>
            <input type="number" id="kaprekar-input" min="1000" max="9999">
            <button class="menu-btn" onclick="runKaprekar()">Mulai</button>
            <div id="kaprekar-result" class="result"></div>
            <button class="back-btn" onclick="backToMenu()">Kembali</button>
        </div>
        <div id="rps" class="game-section">
            <h2>Batu Gunting Kertas</h2>
            <label>Pilihan kamu:</label>
            <select id="rps-user">
                <option value="batu">Batu</option>
                <option value="gunting">Gunting</option>
                <option value="kertas">Kertas</option>
            </select>
            <button class="menu-btn" onclick="runRPS()">Mainkan</button>
            <div id="rps-result" class="result"></div>
            <button class="back-btn" onclick="backToMenu()">Kembali</button>
        </div>
        <div id="guess" class="game-section">
            <h2>Tebak Angka</h2>
            <label>Tebak angka antara 1 dan 100:</label>
            <input type="number" id="guess-input" min="1" max="100">
            <button class="menu-btn" onclick="runGuess()">Tebak</button>
            <div id="guess-result" class="result"></div>
            <button class="back-btn" onclick="backToMenu()">Kembali</button>
        </div>
        <div id="roulette" class="game-section">
            <h2>Russian Roulette</h2>
            <label>Pilih chamber (1-6):</label>
            <input type="number" id="roulette-input" min="1" max="6">
            <button class="menu-btn" onclick="runRoulette()">Mainkan</button>
            <div id="roulette-result" class="result"></div>
            <button class="back-btn" onclick="backToMenu()">Kembali</button>
        </div>
    </div>
    <div id="announcement" style="margin-top:32px; text-align:center; background:#e0e7ff; color:#334155; border-radius:8px; padding:16px; font-size:1em;">
                <strong>Versi 1.0.0</strong><br>
                Update terakhir: 18 September 2025<br>
                Fitur: Kalkulator, Kaprekar, Batu Gunting Kertas, Tebak Angka, Russian Roulette.<br>
                <em>Hubungi PsVanD untuk saran dan laporan bug.</em>
    </div>
    <script>
        let guessNumber = Math.floor(Math.random() * 100) + 1;
        let guessAttempts = 0;
        function showGame(game) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.game-section').forEach(s => s.style.display = 'none');
            document.getElementById(game).style.display = 'block';
            if (game === 'guess') {
                guessNumber = Math.floor(Math.random() * 100) + 1;
                guessAttempts = 0;
                document.getElementById('guess-result').innerText = '';
            }
        }
        function backToMenu() {
            document.getElementById('main-menu').style.display = 'block';
            document.querySelectorAll('.game-section').forEach(s => s.style.display = 'none');
        }
        function runCalculator() {
            let a = parseFloat(document.getElementById('calc-a').value);
            let b = parseFloat(document.getElementById('calc-b').value);
            let op = document.getElementById('calc-op').value;
            let result = '';
            if (isNaN(a) || isNaN(b)) {
                result = 'Input angka tidak valid.';
            } else {
                switch (op) {
                    case '+': result = a + b; break;
                    case '-': result = a - b; break;
                    case '*': result = a * b; break;
                    case '/': result = b !== 0 ? a / b : 'Error: Pembagian dengan nol.'; break;
                }
            }
            document.getElementById('calc-result').innerText = 'Hasil: ' + result;
        }
        function runKaprekar() {
            let num = parseInt(document.getElementById('kaprekar-input').value);
            let result = '';
            if (isNaN(num) || num < 1000 || num > 9999 || new Set(num.toString()).size < 2) {
                result = 'Masukkan angka 4 digit valid dengan setidaknya dua digit berbeda.';
            } else {
                let steps = 0;
                let log = [];
                let reached = false;
                while (num !== 6174 && steps < 7 && num !== 0) {
                    num = kaprekarStep(num);
                    steps++;
                    log.push(`Langkah ${steps}: ${num}`);
                    if (num === 6174) reached = true;
                }
                if (reached) {
                    result = log.join('\n') + `\nBerhasil mencapai 6174 dalam ${steps} langkah!`;
                } else {
                    result = log.join('\n') + '\nGagal mencapai 6174 dalam 7 langkah atau angka tidak valid.';
                }
            }
            document.getElementById('kaprekar-result').innerText = result;
        }
        function kaprekarStep(n) {
            let str = n.toString().padStart(4, '0');
            let asc = parseInt(str.split('').sort().join(''));
            let desc = parseInt(str.split('').sort((a, b) => b - a).join(''));
            return desc - asc;
        }
        function runRPS() {
            const choices = ['batu', 'gunting', 'kertas'];
            let user = document.getElementById('rps-user').value;
            let comp = choices[Math.floor(Math.random() * choices.length)];
            let result = `Komputer memilih: ${comp}\n`;
            if (user === comp) {
                result += 'Hasil: Seri!';
            } else if (
                (user === 'batu' && comp === 'gunting') ||
                (user === 'gunting' && comp === 'kertas') ||
                (user === 'kertas' && comp === 'batu')
            ) {
                result += 'Hasil: Kamu menang!';
            } else {
                result += 'Hasil: Kamu kalah!';
            }
            document.getElementById('rps-result').innerText = result;
        }
        function runGuess() {
            let guess = parseInt(document.getElementById('guess-input').value);
            let result = '';
            if (isNaN(guess) || guess < 1 || guess > 100) {
                result = 'Masukkan angka antara 1 dan 100.';
            } else {
                guessAttempts++;
                if (guess === guessNumber) {
                    result = `Selamat! Kamu menebak dengan benar dalam ${guessAttempts} percobaan.`;
                } else if (guess < guessNumber) {
                    result = 'Terlalu rendah!';
                } else {
                    result = 'Terlalu tinggi!';
                }
                if (guessAttempts >= 10 && guess !== guessNumber) {
                    result += `\nMaaf, kamu kehabisan percobaan. Angka yang benar adalah ${guessNumber}.`;
                }
            }
            document.getElementById('guess-result').innerText = result;
        }
        function runRoulette() {
            let chamber = parseInt(document.getElementById('roulette-input').value);
            let result = '';
            if (isNaN(chamber) || chamber < 1 || chamber > 6) {
                result = 'Pilih chamber antara 1 dan 6.';
            } else {
                let chambers = [0, 0, 0, 0, 0, 1];
                chambers = chambers.sort(() => Math.random() - 0.5);
                if (chambers[chamber - 1] === 1) {
                    result = 'Bledos! Kamu kalah.';
                } else {
                    result = 'Selamat! Kamu selamat.';
                }
            }
            document.getElementById('roulette-result').innerText = result;
        }
    </script>
</body>
</html>
